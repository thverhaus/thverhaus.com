# Byggir Mulehead fyrir Android TV í hvert sinn sem ýtt er á "android"-greinina.
# Niðurstaðan (APK + build.log + STATUS) fer á greinina "android-builds".
# Ekkert er birt á thverhaus.com sjálfkrafa – það er gert sér þegar Júlli segir já.
name: Android build

on:
  push:
    branches: [android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Undirritunarlykill
        id: key
        env:
          KEY_PASS: ${{ secrets.MULEHEAD_KEY_PASS }}
        run: |
          mkdir -p ~/.android out
          if [ -z "$KEY_PASS" ]; then
            echo "VANTAR: secret MULEHEAD_KEY_PASS er ekki sett" | tee out/build.log
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/debug.keystore.enc \
            -out ~/.android/debug.keystore -pass env:KEY_PASS

      - name: Byggja
        id: build
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../out/build.log

      - name: Bera saman undirskrift við útgáfuna á thverhaus.com
        if: steps.build.outcome == 'success'
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cp android/app/build/outputs/apk/release/app-release.apk out/
          curl -fsSL https://thverhaus.com/mulehead.apk -o /tmp/live.apk || true
          {
            echo "== Ný útgáfa"; "$BT/apksigner" verify --print-certs out/app-release.apk | grep -i "SHA-256"
            echo "== Á thverhaus.com"; "$BT/apksigner" verify --print-certs /tmp/live.apk | grep -i "SHA-256" || echo "náði ekki í"
          } > out/SIGNATURE
          "$BT/aapt2" dump badging out/app-release.apk | head -1 > out/VERSION || true
          (cd out && sha256sum app-release.apk > SHA256SUMS)

      - name: Vista niðurstöðu á android-builds
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          echo "build=${{ steps.build.outcome }} key=${{ steps.key.outcome }} sha=${GITHUB_SHA} at=$(date -u +%FT%TZ)" > out/STATUS
          cd out
          git init -q
          git checkout -q -b android-builds
          git config user.name "mulehead-builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${GITHUB_SHA::7}: ${{ steps.build.outcome }}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" android-builds

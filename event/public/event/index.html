<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Viðburðir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
<link href="style.css?v=5" rel="stylesheet">
</head>
<body>
<header>
  <div class="hrow">
    <button class="logo" id="logo">Viðburðir</button>
    <div class="search">
      <input id="q" type="search" autocomplete="off" placeholder="Leita að stað, bæ eða viðburði">
      <div class="suggest hidden" id="qSuggest"></div>
    </div>
    <button class="btn ghost sm" id="langBtn">EN</button>
    <button class="btn" id="mineBtn">Mitt svæði<span class="badge hidden" id="mineBadge"></span></button>
  </div>
  <div class="chips" id="dateChips"></div>
</header>
<div id="publicView">
  <main>
    <aside class="filters" id="filters"></aside>
    <div class="mapwrap">
      <div id="map"></div>
      <div class="regions" id="regions"></div>
    </div>
    <div>
      <div class="listhead"><span class="info" id="listInfo"></span><button class="btn sm hidden" id="showAll"></button></div>
      <div class="list" id="list"></div>
    </div>
  </main>
</div>
<div id="mineView" class="hidden"></div>
<div id="overlays"></div>
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="app.js?v=6"></script>
</body>
</html>
